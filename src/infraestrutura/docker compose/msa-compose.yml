name: MSA

services:
  msa-app:
    build: ../../aplicacao/.
    container_name: msa_app

    ports:
      - "8081:8080"

    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_DATABASE: msa
      DB_USER: root
      DB_PASSWORD: root

      KEYCLOAK_CLIENT_ID: MSA
      KEYCLOAK_CLIENT_SECRET: <CLIENT_SECRET>
      KEYCLOAK_AUTH_SERVER_URL: http://<WIFI IP>:8080
      KEYCLOAK_REALM: dev

      ZABBIX_API_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZABBIX_API_USER_TOKEN: <USER_TOKEN>

    networks:
      - msa-network

networks:
  msa-network:
    external: true