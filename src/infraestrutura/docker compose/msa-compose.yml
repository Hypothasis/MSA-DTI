name: MSA

services:
  msa-app:
    build: ../../aplicacao/.
    container_name: msa-app
    ports:
      - "8081:8080"
    environment:
      # IP DA MAQUINA LOCAL
      - DB_HOST=<IP>
      - DB_PORT=3306
      - DB_DATABASE=msa
      - DB_USER=root
      - DB_PASSWORD=root

      - KEYCLOAK_CLIENT_ID=MSA
      - KEYCLOAK_CLIENT_SECRET=<CLIENT_SECRET>
      # IP DA MAQUINA LOCAL
      - KEYCLOAK_AUTH_SERVER_URL=http://<IP>:8080
      - KEYCLOAK_REALM=dev

      # IP DA MAQUINA LOCAL
      - ZABBIX_API_URL=http://<IP>:8090/api_jsonrpc.php
      - ZABBIX_API_USER_TOKEN=